<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10161e">
  <title>Projects</title>
  <style>
    :root { color-scheme: dark; background: #10161e; color: #e6edf3;
      --surface: #19232e; --raised: #253342; --border: #435566;
      --text: #e6edf3; --muted: #b1c2ce; --accent: #9ddcc8; --control-height: 44px; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #graph { position: fixed; z-index: 1; inset: 0; touch-action: none; outline: none; }
    #selection-pulse { position: fixed; z-index: 2; left: 0; top: 0; pointer-events: none; }
    #graph[aria-busy="true"] { visibility: hidden; }
    #graph:has(+ #fisheye:not([hidden])),
    #graph:has(+ #fisheye:not([hidden])) canvas { cursor: none !important; }
    #views { position: fixed; z-index: 10; top: 12px; right: 12px; display: flex; gap: 4px; }
    #views a, #views button { display: grid; place-items: center; width: var(--control-height); height: var(--control-height);
      color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    #views button { padding: 0; cursor: pointer; }
    #views button:disabled { opacity: .4; cursor: default; }
    #view-toggle, #views button[aria-pressed="true"] {
      color: var(--accent); background: var(--raised); border-color: var(--accent); }
    #views a:focus-visible, #views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #views svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    #view-toggle svg { display: none; }
    #view-toggle[data-current="curated"] .curated-icon,
    #view-toggle[data-current="embedded"] .embedded-icon { display: block; }
    #controls { position: fixed; z-index: 10; top: 12px; left: 12px; width: min(650px, calc(100% - 120px));
      display: grid; grid-template-columns: 1fr 1fr 1.15fr auto; align-items: end; gap: 8px;
      font: 12px system-ui, sans-serif; color: var(--text); }
    #controls > label { display: grid; gap: 4px; min-width: 0; }
    #controls select, #controls summary { width: 100%; height: var(--control-height); padding: 8px;
      border: 1px solid var(--border); border-radius: 6px; color: inherit; background: var(--surface);
      font: inherit; line-height: 20px; cursor: pointer; }
    #controls summary { display: flex; align-items: center; gap: 6px; list-style: none; }
    #controls summary::-webkit-details-marker { display: none; }
    #controls summary::before { content: ''; flex: 0 0 auto;
      border-top: 3px solid transparent; border-bottom: 3px solid transparent;
      border-left: 5px solid currentColor; }
    #controls details[open] > summary::before { transform: rotate(90deg); }
    #controls select:focus-visible, #controls summary:focus-visible,
    #controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #controls details { min-width: 0; }
    #controls details[open] > summary { background: var(--raised); border-color: var(--accent); }
    .control-panel { position: absolute; top: calc(100% + 8px); left: 0; width: min(360px, calc(100vw - 24px));
      max-height: min(65vh, 520px); overflow: auto; overscroll-behavior: contain; padding: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px #00000066; }
    .control-panel fieldset { border: 0; padding: 0; margin: 0 0 14px; }
    .control-panel legend { font-weight: 600; margin-bottom: 6px; }
    .control-panel label { display: flex; align-items: center; gap: 8px; min-height: 32px; cursor: pointer; }
    .control-panel input { accent-color: var(--accent); width: 16px; height: 16px; flex: 0 0 auto; }
    .edge-count { margin-inline-start: auto; flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .control-panel h3 { font-size: 12px; margin: 0 0 8px; }
    .filter-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .filter-actions button { font: inherit; padding: 4px 10px; background: transparent;
      color: inherit; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
    .legend-entry { display: flex; align-items: center; gap: 8px; min-height: 26px; }
    .legend-swatch { width: 16px; height: 16px; border: 1px solid #718596; border-radius: 3px; flex: 0 0 auto; }
    .control-panel input.legend-toggle { appearance: auto; margin: 0; cursor: pointer;
      accent-color: var(--swatch-color); }
    .legend-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .legend-gradient { height: 12px; border-radius: 3px; background: linear-gradient(to right, #d2dee7, #53b9a0); }
    .legend-range { display: flex; justify-content: space-between; gap: 12px; margin-top: 5px; }
    #node-info { position: fixed; z-index: 5; width: min(400px, calc(100vw - 24px)); max-height: 40vh;
      overflow: auto; padding: 14px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text); box-shadow: 0 5px 20px #00000080;
      font: 16px/1.5 system-ui, sans-serif; }
    #node-info p { margin: 8px 0; }
    #node-info a { color: var(--accent); overflow-wrap: anywhere; }
    #node-info strong { padding-right: 24px; display: block; cursor: grab;
      touch-action: none; user-select: none; }
    #node-info.dragging strong { cursor: grabbing; }
    #node-info button { position: absolute; right: 8px; top: 6px; border: 0;
      background: none; color: inherit; font-size: 20px; cursor: pointer; }
    #fisheye { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%;
      background: #10161e; box-shadow: 0 0 0 2px #9ddcc899, 0 8px 28px #00000080; }
    #graph[aria-busy="true"] ~ #fisheye,
    #graph[aria-busy="true"] ~ #lens-status { visibility: hidden; }
    #lens-status { position: fixed; z-index: 4; left: 16px; right: 16px;
      bottom: max(12px, env(safe-area-inset-bottom)); pointer-events: none;
      font: 13px/1.5 system-ui, sans-serif; color: var(--text); text-shadow: 0 1px 3px #10161e; }
    #lens-status a { pointer-events: auto; color: var(--accent); overflow-wrap: anywhere; }
    #lens-status a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 650px) {
      #controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
      #views { flex-direction: column; gap: 6px; }
    }
    @media (hover: none) and (pointer: coarse) {
      #node-info { width: min(320px, calc(100vw - 24px)); font-size: 12px; }
    }
  </style>
  <script src="assets/vendor/cytoscape-3.34.4.min.js"></script>
  <script src="assets/graph-controls.js?v=dcf15a4173ad"></script>
  <script src="assets/graph-selection.js?v=403f5fd27227"></script>
  <script src="assets/graph-fisheye.js?v=5db67f16fed8"></script>
</head>
<body>
  <canvas id="selection-pulse" hidden aria-hidden="true"></canvas>
  <main id="graph" tabindex="0" aria-label="Projects" aria-busy="true"></main>
  <canvas id="fisheye" hidden aria-hidden="true"></canvas>
  <div id="lens-status" role="status" hidden><div id="lens-description"></div><div id="lens-repositories"></div></div>
  <section id="controls" aria-label="Graph appearance and connections" inert>
    <label><select id="color-by" aria-label="Color by"></select></label>
    <label><select id="size-by" aria-label="Size by"></select></label>
    <details id="edge-filter"><summary id="edge-summary">Include edges</summary><div id="edge-options" class="control-panel"></div></details>
    <details id="appearance-legend"><summary>Legend</summary><div id="legend-content" class="control-panel"></div></details>
  </section>
  <nav id="views" aria-label="Graph view and fisheye" inert>
    <a id="view-toggle" href="?view=curated" data-view="curated" data-current="embedded"
       aria-label="Embedded view; switch to curated" title="Embedded">
      <svg class="curated-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L21 7l-4-4Z M14 6l4 4" /></svg>
      <svg class="embedded-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 14 1M5 6l6 13M19 7l-8 12" /><circle cx="5" cy="6" r="3" /><circle cx="19" cy="7" r="3" /><circle cx="11" cy="19" r="3" /></svg>
    </a>
    <button id="fisheye-toggle" type="button" aria-label="Fisheye lens" aria-pressed="false" title="Fisheye">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" /><path d="m15 15 6 6M6.5 10h7M10 6.5v7" /></svg>
    </button>
  </nav>
  <aside id="node-info" role="dialog" aria-labelledby="node-info-name" hidden></aside>
  <script>
    const graph = document.getElementById('graph');
    const nodeDisplayScale = 2;
    const nodeLabelScale = 1.4;
    const physicsBorderWidth = 2.5;
    let cy = null;
    let arrangement = null;
    let selected = null;
    let bubblePosition = null;
    let bubbleDrag = null;
    let positioningBubble = false;
    let liveFrame = null;
    let liveSession = 0, liveInputRevision = 0, liveWorkerRunning = false;
    let liveSnapshot = null, liveNodes = [];
    const liveNodeRevisions = new Map();
    const physicsWorker = new Worker('assets/graph-physics.js?v=09f81abfb1e3');
    physicsWorker.onmessage = ({ data }) => {
      if (data.session !== liveSession || !liveActive) return;
      liveSnapshot = data;
      if (liveFrame === null && !document.hidden) liveFrame = requestAnimationFrame(publishLivePositions);
    };
    physicsWorker.onerror = event => {
      stopLiveLayout();
      console.error('Graph physics worker failed:', event.message);
    };
    let liveActive = false;
    let layoutPreview = false;
    let initialMotion = false;
    let neighborhoodMap = null;
    let layoutAnchors = null;
    let liveNeighborhood = null;
    let liveSourceId = null;
    let positionTargets = new Map();
    let draggedNode = null;
    let currentView = null;
    let graphControls = null;
    let fisheye = null;
    let selectionPulse = null;
    let inventoryData = null;
    let embeddedMap = null;

    function neighborhoodEdges() {
      const nearest = new Set(embeddedMap.embedded.nearest_pair_indices);
      return embeddedMap.embedded.pair_indices.map(index => {
        const [source, target, distance] = embeddedMap.pairs[index];
        return {
          selectable: false,
          data: {
            id: `neighbor:${source}:${target}`,
            source: embeddedMap.node_ids[source], target: embeddedMap.node_ids[target],
            directed: false, distance, length: 45 + distance * 150,
            withinCutoff: index < embeddedMap.embedded.cutoff_edge_count,
            nearest: nearest.has(index)
          }
        };
      });
    }

    function edgesForView(view) {
      if (view === 'embedded') return neighborhoodEdges();
      return inventoryData.links.map(link => ({ selectable: false, data: {
        id: link.id, source: link.source, target: link.target,
        directed: inventoryData.link_types[link.type].directed,
        type: link.type, claims: [link, ...(link.additional_interpretations ?? [])]
      } }));
    }

    function updateViewToggle(view) {
      const toggle = document.getElementById('view-toggle');
      const target = view === 'curated' ? 'embedded' : 'curated';
      const label = view === 'curated' ? 'Curated' : 'Embedded';
      toggle.dataset.current = view;
      toggle.dataset.view = target;
      toggle.title = label;
      toggle.setAttribute('aria-label', `${label} view; switch to ${target}`);
      const url = new URL(location.href);
      url.searchParams.set('view', target);
      toggle.href = url.pathname + url.search;
    }

    function switchView(view, fromHistory = false) {
      if (view !== 'curated' && view !== 'embedded') throw new Error('Choose view=curated or view=embedded.');
      if (view === currentView && !fromHistory) return;
      stopLiveLayout();
      if (arrangement) {
        cancelAnimationFrame(arrangement.frame);
        cy.off('render', arrangement.reveal);
        arrangement = null;
        graph.setAttribute('aria-busy', 'false');
        document.getElementById('controls').inert = false;
        document.getElementById('views').inert = false;
        cy.autoungrabify(false);
        cy.userPanningEnabled(true);
        cy.userZoomingEnabled(true);
      }
      currentView = view;
      neighborhoodMap = view === 'embedded' ? embeddedMap : null;
      if (!fromHistory) {
        const url = new URL(location.href);
        url.searchParams.set('view', view);
        history.pushState(null, '', url);
      }
      updateViewToggle(view);
      cy.batch(() => { cy.edges().remove(); cy.add(edgesForView(view)); });
      graphControls.setView(view === 'embedded', fromHistory);
      updateSelectionBorders();
      graph.setAttribute('aria-description', view === 'embedded'
        ? 'Embedded: the 2% distance cutoff plus each project’s two closest neighbors.'
        : 'Curated project relationships.');
      // Keep the current node positions and camera while the new edges settle.
      layoutAnchors = null;
      positionTargets.clear();
      startLiveLayout();
    }

    // Once the user takes control, initial settling must not refit their camera.
    for (const event of ['pointerdown', 'wheel', 'keydown']) {
      graph.addEventListener(event, () => { initialMotion = false; }, { passive: true });
    }

    function cancelLiveWork() {
      liveSession++;
      physicsWorker.postMessage({ type: 'stop' });
      liveWorkerRunning = false;
      liveSnapshot = null;
      if (liveFrame !== null) cancelAnimationFrame(liveFrame);
      liveFrame = null;
    }

    function stopLiveLayout() {
      cancelLiveWork();
      liveActive = false;
      liveNeighborhood = null;
      liveSourceId = null;
      initialMotion = false;
      if (layoutPreview) {
        layoutPreview = false;
        cy.edges().removeClass('layout-preview');
      }
    }

    function publishLivePositions() {
      liveFrame = null;
      const snapshot = liveSnapshot;
      liveSnapshot = null;
      if (!snapshot || snapshot.session !== liveSession) return;
      const thresholdSquared = (.15 / cy.zoom()) ** 2;
      // A drag or keyboard move owns its node until the worker acknowledges it.
      cy.batch(() => liveNodes.forEach((node, i) => {
        if (node.grabbed() || node.locked() || snapshot.positions[i * 3 + 2] < (liveNodeRevisions.get(node.id()) ?? 0)) return;
        const x = snapshot.positions[i * 3], y = snapshot.positions[i * 3 + 1], current = node.position();
        const dx = x - current.x, dy = y - current.y;
        if (snapshot.settled ? dx !== 0 || dy !== 0 : dx * dx + dy * dy >= thresholdSquared) node.position({ x, y });
      }));
      if (snapshot.settled && snapshot.revision === liveInputRevision) {
        layoutAnchors = new Map(liveNodes.map((node, i) => [node.id(), {
          x: snapshot.positions[i * 3], y: snapshot.positions[i * 3 + 1]
        }]));
        const refit = initialMotion;
        stopLiveLayout();
        if (refit) fitView();
      }
    }

    function sendLiveInput(node, neighborhood, anchors) {
      if (!liveWorkerRunning) return;
      liveNodeRevisions.set(node.id(), ++liveInputRevision);
      physicsWorker.postMessage({ type: 'input', session: liveSession, revision: liveInputRevision,
        id: node.id(), position: { ...node.position() }, grabbed: node.grabbed(), locked: node.locked(),
        target: positionTargets.get(node.id()), neighborhood, anchors });
    }

    function startLiveLayout(source = null) {
      if (!cy || arrangement) return;
      let neighborhood, anchors;
      if (source) {
        if (!layoutAnchors) {
          layoutAnchors = new Map(cy.nodes().map(node => [node.id(), { ...node.position() }]));
          anchors = [...layoutAnchors];
        }
        if (liveSourceId !== source.id()) {
          let affected = source.collection();
          for (let hop = 0; hop < 2; hop++) affected = affected.union(affected.connectedEdges().not('.filtered-out').connectedNodes());
          liveNeighborhood = new Set(affected.map(node => node.id()));
          liveSourceId = source.id();
          neighborhood = [...liveNeighborhood];
        }
      }
      liveActive = true;
      if (document.hidden) return;
      if (liveWorkerRunning) {
        if (source) sendLiveInput(source, neighborhood, anchors);
        return;
      }
      layoutPreview = true;
      cy.edges().addClass('layout-preview');
      liveNodes = cy.nodes(':visible').toArray();
      liveInputRevision = 0;
      liveNodeRevisions.clear();
      const bodies = liveNodes.map(node => {
        const padding = node.data('padding'), extra = 2 * padding + physicsBorderWidth + 2;
        return { id: node.id(), ...node.position(), grabbed: node.grabbed(), locked: node.locked(),
          halfWidth: (node.data('width') + extra) / 2, halfHeight: (node.data('height') + extra) / 2 };
      });
      const pairs = new Map();
      for (const edge of cy.edges().not('.filtered-out')) {
        const ids = [edge.source().id(), edge.target().id()].sort(), key = ids.join('\0');
        if (!pairs.has(key)) pairs.set(key, { a: ids[0], b: ids[1], length: edge.data('length') ?? 65 });
      }
      liveWorkerRunning = true;
      physicsWorker.postMessage({ type: 'start', session: liveSession, bodies, links: [...pairs.values()],
        neighborhood: liveNeighborhood === null ? null : [...liveNeighborhood],
        anchors: layoutAnchors === null ? null : [...layoutAnchors], targets: [...positionTargets],
        stepsPerBatch: matchMedia('(prefers-reduced-motion: reduce)').matches ? 24 : 12 });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelLiveWork();
      else if (liveActive) startLiveLayout();
    });

    function fitView() {
      const padding = innerWidth < 600 ? 24 : 48;
      const top = Math.max(document.getElementById('controls').getBoundingClientRect().bottom,
                           document.getElementById('views').getBoundingClientRect().bottom) + 12;
      const bounds = cy.nodes().boundingBox({ includeOverlays: false });
      const width = cy.width() - 2 * padding, height = Math.max(1, cy.height() - top - padding);
      const zoom = Math.max(cy.minZoom(), Math.min(1.1, width / bounds.w, height / bounds.h));
      cy.zoom(zoom);
      cy.pan({ x: padding + (width - bounds.w * zoom) / 2 - bounds.x1 * zoom,
               y: top + (height - bounds.h * zoom) / 2 - bounds.y1 * zoom });
    }

    // As in best-practices.html, a single arrangement owns computation, fitting,
    // and reveal. A replaced arrangement cannot reveal a later layout early.
    function arrangeGraph(animateAfter = false) {
      stopLiveLayout();
      layoutAnchors = null;
      positionTargets.clear();
      document.getElementById('controls').inert = true;
      document.getElementById('views').inert = true;
      const restoreFocus = arrangement ? arrangement.restoreFocus : document.activeElement === graph;
      if (arrangement) {
        cancelAnimationFrame(arrangement.frame);
        cy.off('render', arrangement.reveal);
      }
      const pending = {
        frame: null,
        restoreFocus,
        reveal() {
          if (arrangement !== pending) return;
          arrangement = null;
          graph.setAttribute('aria-busy', 'false');
          document.getElementById('controls').inert = false;
          document.getElementById('views').inert = false;
          cy.autoungrabify(false);
          cy.userPanningEnabled(true);
          cy.userZoomingEnabled(true);
          if (pending.restoreFocus) graph.focus({ preventScroll: true });
          initialMotion = true;
          startLiveLayout();
        }
      };
      arrangement = pending;
      graph.setAttribute('aria-busy', 'true');
      cy.autoungrabify(true);
      cy.userPanningEnabled(false);
      cy.userZoomingEnabled(false);
      pending.frame = requestAnimationFrame(() => {
        cy.resize();
        cy.nodes().addClass('physics-size');
        cy.elements().not('.filtered-out').layout({
          name: 'cose', fit: false, animate: false, randomize: true,
          nodeDimensionsIncludeLabels: true, nodeRepulsion: 4500,
          nodeOverlap: 20, idealEdgeLength: edge => edge.data('length') ?? 65, componentSpacing: 32,
          gravity: 1, numIter: animateAfter ? 20 : 1000
        }).run();
        cy.nodes().removeClass('physics-size');
        cy.one('render', pending.reveal);
        fitView();
        cy.forceRender();
      });
    }

    function updateSelectionBorders() {
      const depths = new Map();
      if (selected) {
        depths.set(selected.id(), 0);
        const queue = [selected];
        for (let i = 0; i < queue.length; i++) {
          const node = queue[i];
          for (const neighbor of node.connectedEdges().not('.filtered-out').connectedNodes()) {
            if (depths.has(neighbor.id())) continue;
            depths.set(neighbor.id(), depths.get(node.id()) + 1);
            queue.push(neighbor);
          }
        }
      }
      cy.batch(() => cy.nodes().forEach(node => {
        const depth = depths.get(node.id());
        node.data('selectionStrength', depth === undefined ? 0 : 2 ** -depth);
      }));
      selectionPulse?.update();
    }

    function closeNodeInfo() {
      document.getElementById('node-info').hidden = true;
      graph.focus({ preventScroll: true });
    }

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || document.getElementById('node-info').hidden) return;
      event.preventDefault();
      event.stopPropagation();
      closeNodeInfo();
    }, true);

    function selectNode(node) {
      selected = node;
      updateSelectionBorders();
      bubblePosition = null;
      bubbleDrag = null;
      graph.setAttribute('aria-label', node ? node.data('label') : 'Projects');
      const bubble = document.getElementById('node-info');
      bubble.classList.remove('dragging');
      bubble.replaceChildren();
      bubble.hidden = !node;
      if (!node) return;
      const project = inventoryData.projects.find(project => project.id === node.id());
      const name = document.createElement('strong');
      name.id = 'node-info-name'; name.textContent = project.name;
      const description = document.createElement('p'); description.textContent = project.description;
      const activity = document.createElement('p');
      const commitCount = project.user_work.commit_count;
      activity.textContent = `${commitCount.toLocaleString()} personal ${commitCount === 1 ? 'commit' : 'commits'} · ${project.user_work.last_activity_date ?? 'No observed personal activity'}`;
      const close = document.createElement('button');
      close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', 'Close project information');
      close.addEventListener('click', closeNodeInfo);
      name.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        const bounds = bubble.getBoundingClientRect();
        bubbleDrag = { id: event.pointerId, x: event.clientX - bounds.left, y: event.clientY - bounds.top };
        name.setPointerCapture(event.pointerId);
        bubble.classList.add('dragging');
      });
      name.addEventListener('pointermove', event => {
        if (bubbleDrag?.id !== event.pointerId) return;
        bubblePosition = { x: event.clientX - bubbleDrag.x, y: event.clientY - bubbleDrag.y };
        positionNodeInfo();
      });
      name.addEventListener('pointerup', event => {
        if (bubbleDrag?.id === event.pointerId) name.releasePointerCapture(event.pointerId);
      });
      name.addEventListener('lostpointercapture', () => {
        bubbleDrag = null;
        bubble.classList.remove('dragging');
      });
      bubble.append(close, name, description, activity);
      for (const id of project.repository_ids) {
        const repo = inventoryData.repositories.find(repo => repo.id === id);
        const row = document.createElement('div'), link = document.createElement('a');
        link.href = repo.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
        link.textContent = repo.full_name;
        row.append(link, document.createTextNode(` · ${repo.visibility}`)); bubble.append(row);
      }
      positionNodeInfo();
    }

    function positionNodeInfo() {
      const bubble = document.getElementById('node-info');
      if (!selected || bubble.hidden || positioningBubble) return;
      const bounds = selected.renderedBoundingBox({ includeOverlays: false });
      const width = bubble.offsetWidth, height = bubble.offsetHeight;
      const top = Math.min(document.getElementById('controls').getBoundingClientRect().bottom + 10,
        Math.max(12, innerHeight - height - 12));
      const clamp = ({ x, y }) => ({
        x: Math.max(12, Math.min(innerWidth - width - 12, x)),
        y: Math.max(top, Math.min(innerHeight - height - 12, y))
      });
      const preferred = clamp(bubblePosition ?? { x: bounds.x2 + 12, y: (bounds.y1 + bounds.y2 - height) / 2 });
      const clear = ({ x, y }) => x >= bounds.x2 + 12 || x + width <= bounds.x1 - 12
        || y >= bounds.y2 + 12 || y + height <= bounds.y1 - 12;
      const candidates = [preferred,
        { x: bounds.x2 + 12, y: preferred.y },
        { x: bounds.x1 - width - 12, y: preferred.y },
        { x: preferred.x, y: bounds.y2 + 12 },
        { x: preferred.x, y: bounds.y1 - height - 12 }
      ].map(clamp).filter(clear);
      candidates.sort((a, b) => Math.hypot(a.x - preferred.x, a.y - preferred.y)
        - Math.hypot(b.x - preferred.x, b.y - preferred.y));
      const position = candidates[0] ?? preferred;
      bubble.style.left = position.x + 'px';
      bubble.style.top = position.y + 'px';
      if (bubblePosition) bubblePosition = position;
      if (!candidates.length) {
        // If no side fits, keep the bubble visible and expose the node below it.
        bubblePosition = position;
        positioningBubble = true;
        try { cy.panBy({ x: 0, y: position.y + height + 12 - bounds.y1 }); }
        finally { positioningBubble = false; }
      }
    }

    graph.addEventListener('keydown', event => {
      if (!cy || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key.toLowerCase() === 'r') {
        event.preventDefault();
        arrangeGraph();
        return;
      }
      if (arrangement) return;
      const delta = { ArrowLeft: [-24, 0], ArrowRight: [24, 0],
                      ArrowUp: [0, -24], ArrowDown: [0, 24] }[event.key];
      if (delta) {
        event.preventDefault();
        if (selected) {
          const position = selected.position();
          selected.position({ x: position.x + delta[0] / cy.zoom(),
                              y: position.y + delta[1] / cy.zoom() });
          positionTargets.set(selected.id(), { ...selected.position() });
          startLiveLayout(selected);
        } else cy.panBy({ x: -delta[0], y: -delta[1] });
      } else if (event.key === '+' || event.key === '=' || event.key === '-') {
        event.preventDefault();
        const level = cy.zoom() * (event.key === '-' ? 1 / 1.2 : 1.2);
        cy.zoom({ level: Math.max(cy.minZoom(), Math.min(cy.maxZoom(), level)),
                  renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
      } else if (event.key === 'Home') {
        event.preventDefault();
        fitView();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        selectNode(null);
      }
    });

    async function loadJSON(path) {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`Cannot load the repository graph: ${path} returned HTTP ${response.status}.`);
      }
      return response.json();
    }

    async function initialize() {
      const parameters = new URLSearchParams(location.search);
      const view = parameters.get('view') ?? 'curated';
      if (view !== 'curated' && view !== 'embedded') {
        throw new Error('Choose view=curated or view=embedded.');
      }
      updateViewToggle(view);
      const [inventory, map, layouts] = await Promise.all([
        loadJSON('data/repos.json'),
        loadJSON('data/neighborhoods.json'),
        loadJSON('data/layouts.json')
      ]);
      const savedLayout = layouts[view];
      inventoryData = inventory;
      embeddedMap = map;
      currentView = view;
      neighborhoodMap = view === 'embedded' ? map : null;
      if (map) {
        const ids = new Set(inventory.projects.map(project => project.id));
        if (map.node_ids.length !== ids.size || !map.node_ids.every(id => ids.has(id))) {
          throw new Error('The neighborhood map and inventory cover different projects. Rebuild data/neighborhoods.json.');
        }
        graph.setAttribute('aria-description', view === 'embedded'
          ? 'Embedded: the 2% distance cutoff plus each project’s two closest neighbors.'
          : 'Curated project relationships.');
      }
      const measure = document.createElement('canvas').getContext('2d');
      measure.font = '600 13px system-ui';
      const elements = inventory.projects.map(project => {
        const label = project.name;
        const representative = inventory.repositories.find(repo => repo.id === project.repository_ids[0]);
        return { position: savedLayout?.positions[project.id],
          data: { id: project.id, label, url: representative.url, labelWidth: Math.ceil(measure.measureText(label).width),
          width: Math.ceil(measure.measureText(label).width), height: 16, padding: 9,
          color: '#bac5cf', textColor: '#14212a', borderStyle: 'solid', selectionStrength: 0 } };
      });
      elements.push(...edgesForView(view));
      cy = cytoscape({
        container: graph, elements, layout: { name: 'preset' },
        minZoom: .025, maxZoom: 4, boxSelectionEnabled: false,
        wheelSensitivity: 3.2,
        autounselectify: true, desktopTapThreshold: 5, touchTapThreshold: 8,
        style: [
          { selector: 'node', style: {
            shape: 'round-rectangle', width: node => Math.max(node.data('width'), node.data('labelWidth') * nodeLabelScale) * nodeDisplayScale,
            height: node => node.data('height') * nodeDisplayScale,
            padding: node => node.data('padding') * nodeDisplayScale,
            label: 'data(label)', 'font-family': 'system-ui, sans-serif',
            'font-size': 13 * nodeDisplayScale * nodeLabelScale, 'font-weight': 600, 'text-valign': 'center',
            'text-halign': 'center', 'text-wrap': 'none', color: 'data(textColor)',
            'background-color': 'data(color)', 'border-style': 'data(borderStyle)',
            'border-color': 'mapData(selectionStrength, 0, 1, #4d6170, #9fe4cf)',
            'border-opacity': 'mapData(selectionStrength, 0, 1, 0.2, 1)',
            'border-width': physicsBorderWidth * nodeDisplayScale, 'overlay-opacity': 0
          } },
          { selector: 'node.physics-size', style: {
            width: 'data(width)', height: 'data(height)', padding: 'data(padding)',
            'font-size': 13, 'border-width': physicsBorderWidth
          } },
          { selector: 'edge', style: {
            events: 'no', 'overlay-opacity': 0,
            width: 1.3, 'line-color': '#667b88', 'line-opacity': .6,
            'curve-style': 'bezier', 'target-arrow-shape': 'none',
            'target-arrow-color': '#8299a8', 'arrow-scale': .7, label: ''
          } },
          { selector: 'edge[?directed]', style: { 'target-arrow-shape': 'triangle' } },
          { selector: 'edge.layout-preview', style: { 'curve-style': 'straight' } },
          { selector: 'edge.filtered-out', style: { display: 'none' } }
        ]
      });
      cy.on('position', 'node', event => { if (selected === event.target) positionNodeInfo(); });
      cy.on('pan zoom resize', positionNodeInfo);
      cy.on('tap', event => {
        const target = event.target !== cy && event.target.isNode() ? event.target : null;
        const node = fisheye.nodeAt(event.renderedPosition, target);
        if (!node || selected !== node || document.getElementById('node-info').hidden) selectNode(node);
        graph.focus({ preventScroll: true });
      });
      cy.on('grab', 'node', event => {
        graph.style.cursor = 'grabbing'; draggedNode = null;
        sendLiveInput(event.target);
      });
      cy.on('drag', 'node', event => {
        draggedNode = event.target;
        startLiveLayout(event.target);
      });
      cy.on('free', 'node', event => {
        graph.style.cursor = '';
        if (draggedNode === event.target) positionTargets.set(draggedNode.id(), { ...draggedNode.position() });
        sendLiveInput(event.target);
        draggedNode = null;
      });
      let width = cy.width(), height = cy.height();
      cy.on('resize', () => {
        if (width === cy.width() && height === cy.height()) return;
        width = cy.width();
        height = cy.height();
        if (!arrangement) fitView();
      });
      graphControls = attachGraphControls({ cy, inventory, embedded: view === 'embedded', onGraphChange({ edgesChanged = false }) {
        stopLiveLayout();
        if (edgesChanged) updateSelectionBorders();
        layoutAnchors = null;
        positionTargets.clear();
        startLiveLayout();
      } });
      selectionPulse = attachGraphSelectionPulse({ cy, canvas: document.getElementById('selection-pulse'),
        active: () => !!selected, moving: () => liveActive || !!arrangement,
        onFrame: () => fisheye?.refresh() });
      fisheye = attachGraphFisheye({ cy, graph, inventory, selectionPulse });
      document.querySelectorAll('#views a').forEach(link => link.addEventListener('click', event => {
        if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        switchView(link.dataset.view);
      }));
      addEventListener('popstate', () => switchView(new URLSearchParams(location.search).get('view') ?? 'curated', true));
      if (savedLayout) {
        const camera = savedLayout.viewport;
        const scale = Math.min(cy.width() / camera.width, cy.height() / camera.height);
        cy.viewport({ zoom: camera.zoom * scale, pan: {
          x: cy.width() / 2 + (camera.pan.x - camera.width / 2) * scale,
          y: cy.height() / 2 + (camera.pan.y - camera.height / 2) * scale
        } });
        graph.setAttribute('aria-busy', 'false');
        document.getElementById('controls').inert = false;
        document.getElementById('views').inert = false;
        startLiveLayout();
      } else arrangeGraph(true);
    }

    initialize();
  </script>
</body>
</html>
